name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Tests and public build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run test suite
        run: npm test

      - name: Build public assets
        run: npm run build:public

      - name: Validate public assets
        run: npm run check:public

      - name: Ensure generated assets are committed
        run: git diff --exit-code -- public
